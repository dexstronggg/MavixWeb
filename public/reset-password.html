<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="alternate icon" href="/images/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/images/site.webmanifest">
  <meta name="theme-color" content="#07090E">
  <title>Новый пароль — Mavix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <script src="/config.js" defer></script>
  <script src="/js/bg.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/pw-strength.js" defer></script>
  <script src="/js/pages/reset-password.js" defer></script>
</head>
<body>

<canvas class="auth-bg-canvas" id="auth-bg"></canvas>

<main class="auth-shell">
  <section class="auth-card fade-up">
    <header class="auth-header">
      <a class="auth-logo" href="/">
        <span class="logo-mark">M</span>
        <span style="font-family: var(--font-mono); font-weight: 600; letter-spacing: 0.04em;">MAVIX</span>
      </a>
      <h1 class="auth-title">Новый пароль</h1>
      <p class="auth-subtitle">Придумайте новый пароль для своего аккаунта</p>
    </header>

    <form class="form" id="reset-form" novalidate>

      <div class="form-feedback success" data-role="form-success"></div>
      <div class="form-feedback error" data-role="form-error"></div>

      <div class="form-group">
        <label class="form-label" for="password">Новый пароль</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input class="input" type="password" id="password" data-strength name="password" autocomplete="new-password" required minlength="8" maxlength="72" placeholder="Минимум 8 символов">
        </div>
        <div class="form-hint">От 8 до 72 символов</div>
        <div class="form-error" data-role="error-password"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm">Подтвердите пароль</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <input class="input" type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="8" maxlength="72" placeholder="Повторите пароль">
        </div>
        <div class="form-error" data-role="error-confirm"></div>
      </div>

      <button class="btn btn-primary btn-block btn-lg" type="submit" data-role="submit">
        <span data-role="submit-text">Сохранить пароль</span>
        <span class="spinner" data-role="submit-spinner" style="display: none;"></span>
      </button>

      <div class="auth-footer">
        <a href="/login">Вернуться ко входу</a>
      </div>
    </form>
  </section>
</main>

</body>
</html>
