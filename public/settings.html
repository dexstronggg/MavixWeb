<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#07090E">
  <title>Настройки — Mavix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/software.css">
  <script src="/config.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/cabinet.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/pages/settings.js" defer></script>
</head>
<body>

<header class="header">
  <div class="header-inner header-inner-fluid">
    <a class="logo" href="/dashboard">
      <span class="logo-mark">M</span>
      <span>MAVIX</span>
    </a>
    <div class="header-actions">
      <span class="header-user is-skeleton" data-role="header-email" style="min-width:11ch">&nbsp;</span>
      <a class="btn btn-ghost btn-sm" href="#" data-action="logout">Выйти</a>
    </div>
  </div>
</header>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-section-title">Кабинет</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="/dashboard">
          <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
          Главная
        </a>
        <a class="sidebar-link" href="/dashboard/settings">
          <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Настройки
        </a>
      </nav>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Документация</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="/dashboard/docs/user">
          <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4z"/><path d="M4 4v14a2 2 0 0 1 2-2h13"/></svg>
          Пользовательская
        </a>
        <a class="sidebar-link" href="/dashboard/docs/technical">
          <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Техническая
        </a>
      </nav>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Программы</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="/dashboard/software">
          <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Скачать
        </a>
      </nav>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar is-skeleton" data-role="avatar"></div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-email is-skeleton" data-role="email" style="min-width:14ch">&nbsp;</div>
        <div class="sidebar-user-status">
          <span class="status-dot online"></span>
          <span>онлайн</span>
        </div>
        <div class="sidebar-user-id is-skeleton" data-role="user-id" style="min-width:18ch">&nbsp;</div>
      </div>
    </div>
  </aside>

  <main class="app-main">

    <header class="page-head">
      <div class="page-eyebrow">Настройки</div>
      <h1 class="page-title">Безопасность</h1>
      <p class="page-sub">
        Управляйте паролем своего аккаунта Mavix.
      </p>
    </header>

    <section class="card" style="max-width: 640px;">
      <h2 class="card-title">Смена пароля</h2>
      <p class="card-subtitle" style="margin-bottom: 20px;">
        Мы отправим письмо со ссылкой для смены пароля на
        <strong data-role="user-email">ваш email</strong>.
        Ссылка действительна один час.
      </p>

      <div class="form-feedback success" data-role="form-success"></div>
      <div class="form-feedback error" data-role="form-error"></div>

      <button class="btn btn-primary" type="button" data-role="reset-btn">
        <span data-role="reset-btn-text">Отправить ссылку для смены пароля</span>
        <span class="spinner" data-role="reset-btn-spinner" style="display: none;"></span>
      </button>
    </section>

  </main>
</div>

</body>
</html>
