<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#07090E">
  <title>Восстановление пароля — Mavix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <script src="/config.js" defer></script>
  <script src="/js/bg.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/pages/forgot-password.js" defer></script>
</head>
<body>

<canvas class="auth-bg-canvas" id="auth-bg"></canvas>

<main class="auth-shell">
  <section class="auth-card fade-up">
    <header class="auth-header">
      <a class="auth-logo" href="/">
        <span class="logo-mark">M</span>
        <span style="font-family: var(--font-mono); font-weight: 600; letter-spacing: 0.04em;">MAVIX</span>
      </a>
      <h1 class="auth-title">Восстановление</h1>
      <p class="auth-subtitle">Введите email — мы отправим ссылку для сброса пароля</p>
    </header>

    <form class="form" id="forgot-form" novalidate>

      <div class="form-feedback info" data-role="form-info"></div>
      <div class="form-feedback error" data-role="form-error"></div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input class="input" type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="form-error" data-role="error-email"></div>
      </div>

      <button class="btn btn-primary btn-block btn-lg" type="submit" data-role="submit">
        <span data-role="submit-text">Отправить ссылку</span>
        <span class="spinner" data-role="submit-spinner" style="display: none;"></span>
      </button>

      <div class="auth-footer">
        Вспомнили пароль? <a href="/login">Войти</a>
      </div>
    </form>
  </section>
</main>

</body>
</html>
